name: 'Release Desktop App (Windows, macOS, SteamOS)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux / SteamOS build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Build Desktop application
        uses: tauri-apps/action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '克蘇魯文字卡牌冒險 v__VERSION__ (Desktop Demo Release)'
          releaseBody: |
            ### 克蘇魯文字卡牌冒險 (Lovecraftian Text-Card Adventure) v__VERSION__ 獨立桌面發布版
            
            本版本為獨立桌面安裝包（Demo 版），支援各主流作業系統：
            - **Windows**: `.exe` / `.msi` 安裝檔
            - **macOS**: `.dmg` 鏡像檔
            - **SteamOS / Linux**: `.AppImage` 執行檔（支援直接於 Steam Deck 桌面模式執行或匯入 Steam 遊戲庫）
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
