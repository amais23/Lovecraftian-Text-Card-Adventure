name: 'Release Desktop App (Windows, macOS, SteamOS)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux / SteamOS build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Build Desktop application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: '克蘇魯文字卡牌冒險 v__VERSION__ (Desktop Demo Release)'
          releaseBody: |
            ### 克蘇魯文字卡牌冒險 v__VERSION__ (Demo)

            > ⚠️ **重要更新提示（首次啟用自動更新體系）**：  
            > 本版本（**v0.4.1**）為首次接入遊戲內自動更新外掛（Tauri Updater）與 Windows 免安裝原地置換機制（`self_replace`）之版本。  
            > 使用舊版本（**v0.4.0 及更早**）的調查員，因舊版尚無遊戲內更新機制，請務必手動至下方 Assets 下載並覆蓋安裝一次 **v0.4.1**。  
            > 自 **v0.4.1** 開始，後續所有版本更新均可於主選單與設定中享受**遊戲內一鍵背景下載與平滑重啟升級**！

            跨平台獨立桌面版發布，請依作業系統下載對應檔案：

            - 🪟 **Windows**：
              - 💾 **免安裝綠色版 (ZIP)**：`LovecraftianCardAdventure___VERSION___x64_portable.zip`（解壓縮直接開玩，無需安裝）
              - ⚡ **免安裝獨立執行檔 (EXE)**：`LovecraftianCardAdventure.exe`（可攜版原地更新通道檔）
              - 💿 **標準安裝版**：`LovecraftianCardAdventure___VERSION___x64-setup.exe`（自動建立桌面與開始功能表捷徑）
            - 🎮 **SteamOS / Linux (Steam Deck)**：`LovecraftianCardAdventure___VERSION___amd64.AppImage`（免安裝單檔）
            - 🐧 **Debian / Ubuntu**：`LovecraftianCardAdventure___VERSION___amd64.deb`
            - 🍏 **macOS**：`LovecraftianCardAdventure___VERSION___aarch64.dmg`（Apple Silicon M系列）

            ---

            #### 🍏 macOS 開啟指引（Gatekeeper 隔離提示）
            因本遊戲為開源獨立發行，未加入 Apple 年費開發者公證計畫。首次將 App 拖入「應用程式（Applications）」後若開啟時出現 **「已損毀，無法打開。你應該將其丟到垃圾桶」** 的 macOS 預設安全阻擋提示，請在終端機（Terminal）執行以下指令即可正常開啟：

            ```bash
            xattr -cr /Applications/LovecraftianCardAdventure.app
            codesign --force --deep --sign - /Applications/LovecraftianCardAdventure.app
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = (Get-Content package.json | ConvertFrom-Json).version
          if (-not (Test-Path "src-tauri/target/release/app.exe")) {
            Write-Error "Binary app.exe not found!"
            exit 1
          }
          $PORTABLE_DIR = "LovecraftianCardAdventure_${VERSION}_x64_portable"
          New-Item -ItemType Directory -Force -Path $PORTABLE_DIR
          Copy-Item "src-tauri/target/release/app.exe" -Destination "$PORTABLE_DIR/LovecraftianCardAdventure.exe"
          Copy-Item "src-tauri/target/release/app.exe" -Destination "LovecraftianCardAdventure.exe"
          @'
          《克蘇魯文字卡牌冒險》免安裝綠色版 (Windows x64)

          【使用說明】
          1. 雙擊 LovecraftianCardAdventure.exe 即可直接開始遊戲。
          2. 如需桌面捷徑，可對 LovecraftianCardAdventure.exe 點擊滑鼠右鍵 ->「傳送到」->「桌面快捷方式」。
          3. 遊戲存檔將保存在系統的使用者設定檔目錄中（%APPDATA%/com.lovecraftian.cardadventure）。
          4. 若在舊版 Windows 10 出現缺少 WebView2 提示，請前往微軟官網下載安裝「Microsoft Edge WebView2 Runtime」。
          '@ | Out-File -FilePath "$PORTABLE_DIR/說明與捷徑教學.txt" -Encoding utf8
          $ZIP_NAME = "LovecraftianCardAdventure_${VERSION}_x64_portable.zip"
          Compress-Archive -Path $PORTABLE_DIR -DestinationPath $ZIP_NAME -Force
          $TAG_NAME = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME } else { "v$VERSION" }
          gh release upload $TAG_NAME $ZIP_NAME LovecraftianCardAdventure.exe --clobber

