<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="parchmentVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1612" />
      <stop offset="50%" stop-color="#120e0a" />
      <stop offset="100%" stop-color="#070503" />
    </radialGradient>

    <!-- Arcane Gold Glow Filter -->
    <filter id="arcaneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Metallic Gradient -->
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d289" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#7a5506" />
    </linearGradient>

    <linearGradient id="runePulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e9d8a6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8c6a2b" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Parchment Texture -->
  <rect width="1200" height="900" fill="url(#parchmentVignette)" />

  <!-- Outer Arcane Frame -->
  <rect x="50" y="40" width="1100" height="820" rx="16" fill="none" stroke="url(#goldFiligree)" stroke-width="3" stroke-dasharray="16, 8" opacity="0.6" />
  <rect x="70" y="60" width="1060" height="780" rx="12" fill="none" stroke="#684e20" stroke-width="1.5" opacity="0.4" />

  <!-- Sacred Geometry Astronomical Rings -->
  <circle cx="600" cy="450" r="320" fill="none" stroke="url(#goldFiligree)" stroke-width="1" stroke-dasharray="6, 12" opacity="0.3" />
  <circle cx="600" cy="450" r="260" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="2, 6" opacity="0.4" />
  <circle cx="600" cy="450" r="180" fill="none" stroke="url(#runePulse)" stroke-width="1" opacity="0.35" />

  <!-- Corner Eldritch Glyphs & Corners -->
  <path d="M 80,140 L 80,80 L 140,80" fill="none" stroke="url(#goldFiligree)" stroke-width="4" />
  <path d="M 1120,140 L 1120,80 L 1060,80" fill="none" stroke="url(#goldFiligree)" stroke-width="4" />
  <path d="M 80,760 L 80,820 L 140,820" fill="none" stroke="url(#goldFiligree)" stroke-width="4" />
  <path d="M 1120,760 L 1120,820 L 1060,820" fill="none" stroke="url(#goldFiligree)" stroke-width="4" />

  <!-- Stylized Incomplete Seal / Eye of Truth -->
  <g transform="translate(600, 360)" filter="url(#arcaneGlow)">
    <!-- Arcane Astrolabe Triangle & Star -->
    <polygon points="0,-100 86.6,50 -86.6,50" fill="none" stroke="#cfa866" stroke-width="2" opacity="0.5" />
    <polygon points="0,100 -86.6,-50 86.6,-50" fill="none" stroke="#cfa866" stroke-width="2" opacity="0.5" />

    <!-- Incomplete Eye Silhouette -->
    <path d="M -90,0 Q 0,-70 90,0 Q 0,70 -90,0 Z" fill="none" stroke="url(#goldFiligree)" stroke-width="3" opacity="0.75" />
    <circle cx="0" cy="0" r="24" fill="#080605" stroke="#f3d289" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#f3d289" opacity="0.9" />

    <!-- Drafting Compass Ray Lines (Implying artwork in progress) -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#a27e36" stroke-width="1" stroke-dasharray="4, 4" opacity="0.4" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#a27e36" stroke-width="1" stroke-dasharray="4, 4" opacity="0.4" />
  </g>

  <!-- Central Title Text -->
  <text x="600" y="555" text-anchor="middle" font-family="'Noto Serif TC', 'Cinzel', serif, sans-serif" font-size="52" font-weight="bold" fill="#f7e6b5" letter-spacing="14" filter="url(#arcaneGlow)">
    還 沒 畫 好
  </text>

  <!-- Subtitle Text -->
  <text x="600" y="615" text-anchor="middle" font-family="'Cinzel', 'Noto Serif TC', serif, sans-serif" font-size="22" font-weight="600" fill="#c09b4d" letter-spacing="8" opacity="0.85">
    太古殘卷待勘 · 繪卷繪製中 (WIP)
  </text>

  <!-- Ambient Micro Lore Note -->
  <text x="600" y="660" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#755a2c" letter-spacing="4" opacity="0.7">
    〔 密契學者正於阿卡姆手抄館探詢原典 〕
  </text>
</svg>
