<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <!-- Cold Cosmic Void Navy/Black Gradient -->
    <radialGradient id="voidCosmos" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1d3a" />
      <stop offset="35%" stop-color="#060e1d" />
      <stop offset="70%" stop-color="#02060d" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    <!-- Sublime Eldritch Eye Iris (Cold Silver / Cyan Star Stare) -->
    <radialGradient id="eldritchEyeIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00040a" />
      <stop offset="20%" stop-color="#0369a1" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </radialGradient>

    <!-- Ancient Torn Parchment Gradient -->
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#fde68a" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Celestial Aura Glow -->
    <filter id="cosmicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmos Void -->
  <rect width="240" height="180" rx="10" fill="url(#voidCosmos)" />

  <!-- Distant Nebular Dust Band -->
  <path d="M 0 130 Q 80 80 160 110 T 240 60 L 240 180 L 0 180 Z" fill="#0369a1" opacity="0.12" filter="blur(20px)" />
  <path d="M 0 40 Q 90 90 180 50 T 240 100 L 240 0 L 0 0 Z" fill="#38bdf8" opacity="0.08" filter="blur(16px)" />

  <!-- Pinpoint Distant Stars & Constellations -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="25" cy="35" r="0.8" />
    <circle cx="45" cy="22" r="1.2" />
    <circle cx="85" cy="38" r="0.6" />
    <circle cx="210" cy="28" r="1" />
    <circle cx="225" cy="55" r="0.8" />
    <circle cx="195" cy="145" r="1.2" />
    <circle cx="35" cy="155" r="0.7" />
    <circle cx="15" cy="115" r="1" />
  </g>

  <!-- COLOSSAL CELESTIAL ELDRITCH EYE (旧日神性天啟巨眼) -->
  <g opacity="0.75" filter="url(#cosmicGlow)">
    <!-- Multi-Dimensional Concentric Planetary Orbits & Sacred Geometry Rings -->
    <circle cx="120" cy="85" r="78" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.4" />
    <circle cx="120" cy="85" r="62" fill="none" stroke="#e0f2fe" stroke-width="0.7" opacity="0.6" />
    <circle cx="120" cy="85" r="46" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" opacity="0.8" />

    <!-- Orbital Geometric Cross-Axes & Angle Markers -->
    <line x1="120" y1="5" x2="120" y2="165" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="1 8" opacity="0.4" />
    <line x1="40" y1="85" x2="200" y2="85" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="1 8" opacity="0.4" />

    <!-- Divine Celestial Sclera Outline (Almond Eye of the Void) -->
    <path d="M 45 85 Q 120 40 195 85 Q 120 130 45 85 Z"
          fill="#020c1b" stroke="#e0f2fe" stroke-width="1.6" opacity="0.9" />

    <!-- Radiant Divine Iris -->
    <circle cx="120" cy="85" r="26" fill="url(#eldritchEyeIris)" />

    <!-- Intricate Cosmic Eye Iris Fibers (Radial Spoke Striae) -->
    <g stroke="#0369a1" stroke-width="0.8" opacity="0.7">
      <line x1="120" y1="59" x2="120" y2="111" />
      <line x1="94" y1="85" x2="146" y2="85" />
      <line x1="102" y1="67" x2="138" y2="103" />
      <line x1="102" y1="103" x2="138" y2="67" />
    </g>

    <!-- Void Core Vertical Slit Pupil (凝視凡人靈魂之黑洞瞳孔) -->
    <ellipse cx="120" cy="85" rx="5" ry="18" fill="#000000" stroke="#0284c7" stroke-width="0.8" />
    <!-- Stellar Reflection in God-Eye -->
    <circle cx="117" cy="79" r="1.5" fill="#ffffff" />
  </g>

  <!-- FLOATING TORN PARCHMENT FRAGMENT (舊日殘頁本體) -->
  <g transform="rotate(-6 125 95)">
    <!-- Ragged Charred Deckle-Edge Parchment -->
    <path d="M 75 42 
             C 85 40, 105 44, 120 41 
             C 135 39, 150 43, 162 40 
             C 165 55, 168 70, 166 90 
             C 169 110, 164 130, 168 145 
             C 152 147, 138 143, 120 146 
             C 102 148, 88 142, 72 145 
             C 74 130, 71 110, 75 92 
             C 69 75, 76 58, 75 42 Z"
          fill="url(#parchmentGrad)" stroke="#451a03" stroke-width="1.8" />

    <!-- Burn Marks / Ancient Erosion Stains on Parchment -->
    <path d="M 75 42 Q 85 50 80 58 Q 72 52 75 42 Z" fill="#451a03" opacity="0.6" />
    <path d="M 162 40 Q 155 52 165 60 Z" fill="#451a03" opacity="0.7" />
    <path d="M 168 145 Q 158 135 162 125 Z" fill="#451a03" opacity="0.6" />
    <path d="M 72 145 Q 85 138 78 128 Z" fill="#451a03" opacity="0.7" />

    <!-- Eldritch Incomprehensible Inscriptions & Non-Euclidean Glyphs -->
    <g stroke="#1e0b04" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85">
      <!-- Line 1 Runic script -->
      <line x1="84" y1="56" x2="110" y2="56" />
      <circle cx="114" cy="56" r="1.5" />
      <line x1="120" y1="56" x2="155" y2="56" />

      <!-- Eldritch Central Sigil: Multi-Winged Eye Rune -->
      <path d="M 98 88 Q 120 72 142 88 Q 120 104 98 88 Z" stroke="#78350f" stroke-width="1.5" />
      <circle cx="120" cy="88" r="4" fill="#78350f" />
      <path d="M 120 68 L 120 76 M 120 100 L 120 108" stroke="#78350f" stroke-width="1.5" />
      <path d="M 104 76 L 110 82 M 136 76 L 130 82" stroke="#78350f" stroke-width="1.2" />

      <!-- Line 3 Script -->
      <line x1="86" y1="120" x2="114" y2="120" />
      <line x1="122" y1="120" x2="152" y2="120" />
      <line x1="90" y1="130" x2="148" y2="130" stroke-dasharray="4 3" />
    </g>

    <!-- Faint Bioluminescent Cyan Truth Glow Emanating from Text -->
    <g stroke="#38bdf8" stroke-width="0.8" fill="none" opacity="0.75" filter="url(#cosmicGlow)">
      <path d="M 100 88 Q 120 75 140 88 Q 120 101 100 88 Z" />
      <circle cx="120" cy="88" r="2" fill="#e0f2fe" />
    </g>
  </g>

  <!-- Wafting Cosmic Silver Dust & Star Rays -->
  <g fill="#e0f2fe">
    <circle cx="178" cy="72" r="1.5" filter="url(#cosmicGlow)" />
    <circle cx="62" cy="115" r="1.2" filter="url(#cosmicGlow)" />
    <!-- 4-point Silver Polar Star -->
    <path d="M 195 48 Q 196 52 200 52 Q 196 52 195 56 Q 194 52 190 52 Q 194 52 195 48 Z" />
  </g>
</svg>
