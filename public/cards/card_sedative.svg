<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <!-- Slate Clinical Background Gradient -->
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e232a" />
      <stop offset="60%" stop-color="#12161c" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>

    <!-- Warm Amber Medical Liquid -->
    <linearGradient id="amberLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#f77f00" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#d62828" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6a040f" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glass Barrel Reflections -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="90%" stop-color="#a2d2ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Stainless Steel Metal -->
    <linearGradient id="steelMetal" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="25%" stop-color="#ced4da" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#6c757d" />
      <stop offset="100%" stop-color="#343a40" />
    </linearGradient>

    <!-- Brass Flange Accent -->
    <linearGradient id="brassAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d8a6" />
      <stop offset="50%" stop-color="#ee9b00" />
      <stop offset="100%" stop-color="#94d2bd" />
    </linearGradient>

    <!-- Glowing Amber Droplet -->
    <radialGradient id="dropletGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffe6a7" />
      <stop offset="70%" stop-color="#f77f00" />
      <stop offset="100%" stop-color="#99582a" />
    </radialGradient>

    <!-- Precision Drop Shadow -->
    <filter id="medShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="180" rx="10" fill="url(#medBg)" />

  <!-- Technical Background Grid Lines (1920s Medical Journal / Blueprint feel) -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="20" y1="0" x2="20" y2="180" />
    <line x1="60" y1="0" x2="60" y2="180" />
    <line x1="100" y1="0" x2="100" y2="180" />
    <line x1="140" y1="0" x2="140" y2="180" />
    <line x1="180" y1="0" x2="180" y2="180" />
    <line x1="220" y1="0" x2="220" y2="180" />
    <line x1="0" y1="30" x2="240" y2="30" />
    <line x1="0" y1="70" x2="240" y2="70" />
    <line x1="0" y1="110" x2="240" y2="110" />
    <line x1="0" y1="150" x2="240" y2="150" />
  </g>

  <!-- Atmospheric Glow from Amber Chemical Liquid -->
  <circle cx="115" cy="95" r="50" fill="#f77f00" opacity="0.15" filter="blur(16px)" />

  <!-- THE MEDICAL SEDATIVE SYRINGE (Angled ~28 degrees) -->
  <g transform="rotate(-26 120 90)" filter="url(#medShadow)">
    <!-- 1. Plunger Rod & Finger Rings (Rear) -->
    <rect x="25" y="87" width="45" height="6" rx="2" fill="url(#steelMetal)" stroke="#1a1c20" stroke-width="1.2" />
    <line x1="30" y1="87" x2="30" y2="93" stroke="#495057" stroke-width="1" />
    <line x1="40" y1="87" x2="40" y2="93" stroke="#495057" stroke-width="1" />
    <line x1="50" y1="87" x2="50" y2="93" stroke="#495057" stroke-width="1" />

    <!-- Dual Finger Rings (Thumb Loop) -->
    <ellipse cx="20" cy="90" rx="9" ry="11" fill="none" stroke="url(#steelMetal)" stroke-width="3" />
    <ellipse cx="20" cy="90" rx="9" ry="11" fill="none" stroke="#121417" stroke-width="0.8" />

    <!-- Rear Flange Collar (Brass/Steel rim) -->
    <rect x="68" y="78" width="8" height="24" rx="2" fill="url(#steelMetal)" stroke="#1a1c20" stroke-width="1.2" />
    <rect x="74" y="80" width="3" height="20" rx="1" fill="#ced4da" />

    <!-- Rubber / Leather Plunger Head Inside Glass -->
    <rect x="75" y="81" width="10" height="18" rx="2" fill="#212529" stroke="#000" stroke-width="1" />

    <!-- 2. The Glass Barrel Outer Cylinder -->
    <rect x="76" y="79" width="85" height="22" rx="3" fill="#1b222a" opacity="0.4" />

    <!-- Sedative Amber Solution (Chemical Liquid) -->
    <rect x="85" y="81" width="74" height="18" rx="2" fill="url(#amberLiquid)" />

    <!-- Meniscus & Liquid Highlights -->
    <ellipse cx="85" cy="90" rx="2.5" ry="9" fill="#ffd166" opacity="0.8" />
    <ellipse cx="159" cy="90" rx="1" ry="9" fill="#ffb703" opacity="0.6" />

    <!-- Micro Air Bubbles in Sedative -->
    <circle cx="105" cy="86" r="1.5" fill="#ffffff" opacity="0.75" />
    <circle cx="125" cy="93" r="1" fill="#ffffff" opacity="0.6" />
    <circle cx="140" cy="88" r="2" fill="#ffffff" opacity="0.7" />

    <!-- Syringe Measurement Ticks (Real 1cc ~ 5cc Engravings) -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.75">
      <line x1="95" y1="79" x2="95" y2="85" />
      <line x1="102" y1="79" x2="102" y2="82" />
      <line x1="110" y1="79" x2="110" y2="85" />
      <line x1="118" y1="79" x2="118" y2="82" />
      <line x1="126" y1="79" x2="126" y2="85" />
      <line x1="134" y1="79" x2="134" y2="82" />
      <line x1="142" y1="79" x2="142" y2="85" />
      <line x1="150" y1="79" x2="150" y2="82" />
    </g>

    <!-- Glass Barrel Outer Contour & Reflections -->
    <rect x="76" y="79" width="85" height="22" rx="3" fill="url(#glassReflection)" stroke="#6c757d" stroke-width="1.2" />
    <!-- Glass Specular Highlight Strips -->
    <line x1="78" y1="82" x2="159" y2="82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="82" y1="98" x2="155" y2="98" stroke="#a2d2ff" stroke-width="0.8" stroke-linecap="round" opacity="0.45" />

    <!-- 3. Front Luer-Lock Metal Hub -->
    <path d="M 161 84 L 170 86 L 170 94 L 161 96 Z" fill="url(#steelMetal)" stroke="#1a1c20" stroke-width="1.2" />
    <rect x="170" y="87" width="5" height="6" fill="#adb5bd" stroke="#1a1c20" stroke-width="1" />

    <!-- 4. Stainless Steel Hypodermic Needle -->
    <line x1="175" y1="90" x2="216" y2="90" stroke="url(#steelMetal)" stroke-width="1.6" stroke-linecap="square" />
    <line x1="175" y1="89.5" x2="214" y2="89.5" stroke="#ffffff" stroke-width="0.6" />
    <!-- Beveled Sharp Needle Tip -->
    <path d="M 214 89.2 L 218 90 L 214 90.8 Z" fill="#f8f9fa" />

    <!-- 5. Suspended Luminous Amber Medicine Droplet -->
    <ellipse cx="221" cy="91" rx="3.5" ry="2.2" fill="url(#dropletGlow)" />
    <!-- Droplet Specular Reflection -->
    <circle cx="220" cy="90.5" r="0.8" fill="#ffffff" />
  </g>

  <!-- Cold Metallic Clinical Flares -->
  <g opacity="0.7">
    <!-- Star Glint on Needle Tip -->
    <path d="M 198 42 Q 200 42 200 39 Q 200 42 202 42 Q 200 42 200 45 Q 200 42 198 42 Z" fill="#ffffff" />
    <!-- Glass Highlight Glint -->
    <path d="M 112 82 Q 114 82 114 79 Q 114 82 116 82 Q 114 82 114 85 Q 114 82 112 82 Z" fill="#ffffff" />
  </g>

  <!-- Technical Spec Text (Realism aesthetic stamp) -->
  <text x="24" y="165" fill="#f4a261" font-family="monospace" font-size="7" letter-spacing="1.5" opacity="0.6">
    SPEC: 5.0ml MORPHINE SULFATE // BATCH #ARK-1926
  </text>
</svg>
