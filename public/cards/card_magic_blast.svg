<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <!-- Sunny Fantasy Sky-Violet Radial Gradient -->
    <radialGradient id="fantasyBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#7b2cbf" />
      <stop offset="45%" stop-color="#3c096c" />
      <stop offset="85%" stop-color="#240046" />
      <stop offset="100%" stop-color="#10002b" />
    </radialGradient>

    <!-- Brilliant Sun Gold Core -->
    <radialGradient id="sunburstCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff3b0" />
      <stop offset="55%" stop-color="#ffd166" />
      <stop offset="85%" stop-color="#f72585" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0" />
    </radialGradient>

    <!-- Amethyst Crystal Facet Gradient -->
    <linearGradient id="crystalFacetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0aaff" />
      <stop offset="70%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#5a189a" />
    </linearGradient>

    <linearGradient id="crystalFacetB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c77dff" />
      <stop offset="60%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>

    <!-- Prismatic Rainbow Cyan Shimmer -->
    <linearGradient id="rainbowShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="35%" stop-color="#ffd166" />
      <stop offset="70%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>

    <!-- Crystal Glow Filter -->
    <filter id="fantasyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="180" rx="10" fill="url(#fantasyBg)" />

  <!-- Luminous Golden Sunburst Beams (Sunny High Fantasy) -->
  <g opacity="0.35">
    <polygon points="120,90 20,-20 60,-30" fill="#ffd166" />
    <polygon points="120,90 140,-30 180,-20" fill="#ffd166" />
    <polygon points="120,90 270,30 280,70" fill="#ffd166" />
    <polygon points="120,90 270,130 250,170" fill="#ffd166" />
    <polygon points="120,90 160,210 120,220" fill="#ffd166" />
    <polygon points="120,90 60,210 30,190" fill="#ffd166" />
    <polygon points="120,90 -30,140 -20,100" fill="#ffd166" />
    <polygon points="120,90 -20,40 10,10" fill="#ffd166" />
  </g>

  <!-- Central Sunburst Corona -->
  <circle cx="120" cy="90" r="75" fill="url(#sunburstCore)" />

  <!-- Outer Concentric Magic Glyphs & Circles -->
  <g stroke="#ffd166" fill="none" stroke-linecap="round" opacity="0.85">
    <!-- Outer Inscribed Circle with Micro-Ticks -->
    <circle cx="120" cy="90" r="66" stroke-width="1.2" stroke-dasharray="8 4" />
    <circle cx="120" cy="90" r="62" stroke-width="1.8" />
    <circle cx="120" cy="90" r="48" stroke-width="1" stroke-dasharray="3 3" />

    <!-- 8 Outer Runic Dots & Diamond Anchors -->
    <circle cx="120" cy="28" r="2.5" fill="#ffd166" />
    <circle cx="120" cy="152" r="2.5" fill="#ffd166" />
    <circle cx="58" cy="90" r="2.5" fill="#ffd166" />
    <circle cx="182" cy="90" r="2.5" fill="#ffd166" />
    <circle cx="76" cy="46" r="2" fill="#48cae4" />
    <circle cx="164" cy="46" r="2" fill="#48cae4" />
    <circle cx="76" cy="134" r="2" fill="#48cae4" />
    <circle cx="164" cy="134" r="2" fill="#48cae4" />
  </g>

  <!-- Concentric Radiant 8-Pointed Star Array (High Fantasy Starlight) -->
  <polygon points="120,38 127,78 168,71 133,93 155,128 120,106 85,128 107,93 72,71 113,78"
           fill="none" stroke="url(#rainbowShimmer)" stroke-width="1.8" opacity="0.9" />

  <!-- Secondary Mirrored 8-Pointed Star -->
  <polygon points="120,45 125,77 157,75 130,94 146,122 120,104 94,122 110,94 83,75 115,77"
           fill="none" stroke="#ffd166" stroke-width="1.2" opacity="0.75" />

  <!-- Dynamic Swirling Prismatic Mana Ribbons -->
  <path d="M 50 140 C 70 80, 150 70, 190 40 C 170 90, 90 110, 50 140 Z"
        fill="url(#rainbowShimmer)" opacity="0.45" filter="url(#fantasyGlow)" />
  <path d="M 60 45 C 110 55, 130 135, 185 145 C 140 125, 100 115, 60 45 Z"
        fill="url(#rainbowShimmer)" opacity="0.4" filter="url(#fantasyGlow)" />

  <!-- EXPLODING IRIDESCENT AMETHYST PRISMS (Center Core Burst) -->
  <g filter="url(#fantasyGlow)">
    <!-- Main Center Crystal Diamond -->
    <polygon points="120,62 136,90 120,118 104,90" fill="url(#crystalFacetA)" stroke="#ffffff" stroke-width="1" />
    <!-- Crystal Facet Shading -->
    <polygon points="120,62 136,90 120,90" fill="#ffffff" opacity="0.6" />
    <polygon points="120,90 136,90 120,118" fill="url(#crystalFacetB)" opacity="0.8" />
    <polygon points="104,90 120,90 120,118" fill="#3c096c" opacity="0.7" />

    <!-- Radiating Flying Crystal Shards -->
    <!-- Top-Right Shard -->
    <polygon points="152,65 162,56 160,70" fill="url(#crystalFacetA)" stroke="#ffffff" stroke-width="0.8" />
    <!-- Bottom-Right Shard -->
    <polygon points="150,115 165,124 153,128" fill="url(#crystalFacetB)" stroke="#ffffff" stroke-width="0.8" />
    <!-- Top-Left Shard -->
    <polygon points="88,68 76,58 84,54" fill="url(#crystalFacetA)" stroke="#ffffff" stroke-width="0.8" />
    <!-- Bottom-Left Shard -->
    <polygon points="86,112 74,122 88,126" fill="url(#crystalFacetB)" stroke="#ffffff" stroke-width="0.8" />
  </g>

  <!-- Glinting 4-Point High-Fantasy Sparkle Stars -->
  <g fill="#ffffff">
    <!-- Top Glint -->
    <path d="M 120 58 Q 121 62 125 62 Q 121 62 120 66 Q 119 62 115 62 Q 119 62 120 58 Z" />
    <!-- Right Glint -->
    <path d="M 172 82 Q 174 86 178 86 Q 174 86 172 90 Q 170 86 166 86 Q 170 86 172 82 Z" />
    <!-- Left Small Glint -->
    <path d="M 68 96 Q 70 99 73 99 Q 70 99 68 102 Q 66 99 63 99 Q 66 99 68 96 Z" />
    <!-- Bottom Glint -->
    <path d="M 132 128 Q 134 131 137 131 Q 134 131 132 134 Q 130 131 127 131 Q 130 131 132 128 Z" />
    <!-- Distant Star -->
    <circle cx="188" cy="48" r="2" fill="#ffd166" />
    <circle cx="52" cy="130" r="2.5" fill="#48cae4" />
    <circle cx="198" cy="132" r="1.5" fill="#f72585" />
    <circle cx="42" cy="58" r="1.5" fill="#ffd166" />
  </g>

  <!-- Golden Magic Particle Dust (Floating Fairy Stars) -->
  <g fill="#ffd166" opacity="0.85">
    <circle cx="100" cy="72" r="1.2" />
    <circle cx="140" cy="74" r="1.5" />
    <circle cx="106" cy="108" r="1.2" />
    <circle cx="138" cy="106" r="1.8" />
    <circle cx="120" cy="134" r="1.5" />
    <circle cx="156" cy="92" r="1.2" />
    <circle cx="84" cy="88" r="1.4" />
  </g>
</svg>
