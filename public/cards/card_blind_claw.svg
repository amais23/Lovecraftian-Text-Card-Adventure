<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <!-- Deep Visceral Abyss Background Gradient -->
    <radialGradient id="abyssBg" cx="45%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#40040c" />
      <stop offset="35%" stop-color="#240207" />
      <stop offset="75%" stop-color="#100103" />
      <stop offset="100%" stop-color="#050001" />
    </radialGradient>

    <!-- Raw Muscle / Flesh Tendril Gradient -->
    <linearGradient id="fleshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="30%" stop-color="#c9184a" />
      <stop offset="70%" stop-color="#800f2f" />
      <stop offset="100%" stop-color="#38040e" />
    </linearGradient>

    <!-- Aberrant Bone Claw Gradient -->
    <linearGradient id="boneClawGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="40%" stop-color="#dee2e6" />
      <stop offset="75%" stop-color="#adb5bd" />
      <stop offset="100%" stop-color="#495057" />
    </linearGradient>

    <!-- Corrupted Dark Ichor -->
    <radialGradient id="corruptedBlood" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="40%" stop-color="#7209b7" />
      <stop offset="85%" stop-color="#240046" />
      <stop offset="100%" stop-color="#0a0014" />
    </radialGradient>

    <!-- Visceral Slash Glow Filter -->
    <filter id="visceralGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Abyss Flesh Background -->
  <rect width="240" height="180" rx="10" fill="url(#abyssBg)" />

  <!-- Chaotic Web of Branching Red Veins / Capillaries -->
  <g stroke="#ff4d6d" stroke-width="0.8" fill="none" opacity="0.3">
    <path d="M 0 30 Q 50 45 80 80 T 130 140" />
    <path d="M 60 48 Q 90 35 140 50" />
    <path d="M 0 160 Q 60 140 90 110 T 170 80" />
    <path d="M 240 20 Q 180 50 150 90" />
    <path d="M 240 150 Q 190 120 160 110" />
  </g>

  <!-- WRITHING BACKGROUND TENTACLES (深淵異化觸鬚) -->
  <g fill="none" stroke-linecap="round">
    <!-- Top-Left Writhing Tentacle -->
    <path d="M -10 10 C 30 25, 40 70, 20 100 C 10 115, 35 125, 45 140"
          stroke="url(#fleshGrad)" stroke-width="7" opacity="0.75" />
    <path d="M -10 10 C 30 25, 40 70, 20 100 C 10 115, 35 125, 45 140"
          stroke="#590d22" stroke-width="2" opacity="0.9" />

    <!-- Bottom-Right Sinister Tendril -->
    <path d="M 250 170 C 200 150, 180 120, 210 90 C 225 75, 190 60, 180 40"
          stroke="url(#corruptedBlood)" stroke-width="6" opacity="0.6" />
  </g>

  <!-- VIOLENT REALITY-TEARING CLAW SLASH WOUNDS (爪擊撕裂空間紅光) -->
  <g filter="url(#visceralGlow)" opacity="0.85">
    <path d="M 35 40 L 190 140" stroke="#ff334b" stroke-width="3" stroke-linecap="round" />
    <path d="M 50 25 L 210 130" stroke="#ff4d6d" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 75 18 L 230 115" stroke="#ff758f" stroke-width="2.8" stroke-linecap="round" />
    <!-- White Hot Inner Slash Core -->
    <path d="M 54 27 L 206 128" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- THE MUTATED ABERRANT FLESH CLAW (主體異化骨爪) -->
  <g>
    <!-- Forearm Muscle Sinew & Mutated Tendons -->
    <path d="M 0 110 
             C 25 105, 50 115, 75 105 
             C 90 98, 105 108, 115 95 
             C 110 125, 95 135, 70 140 
             C 45 145, 20 135, 0 145 Z"
          fill="url(#fleshGrad)" stroke="#2b0006" stroke-width="2" />

    <!-- Pulsing Veins on Forearm -->
    <path d="M 15 118 Q 45 125 75 115 T 105 105" fill="none" stroke="#ff4d6d" stroke-width="1.5" />
    <path d="M 30 130 Q 60 135 85 125" fill="none" stroke="#240046" stroke-width="2" />

    <!-- Exposed Splintered Bone Spur on Wrist (異化骨刺) -->
    <path d="M 45 108 L 38 85 L 56 102 Z" fill="url(#boneClawGrad)" stroke="#1a0003" stroke-width="1.2" />

    <!-- Unsettling Mutated Aberrant Eye on Knuckle (血肉中睜開的異變邪眼) -->
    <ellipse cx="85" cy="115" rx="7" ry="5" fill="#1b0003" stroke="#ff4d6d" stroke-width="1" />
    <ellipse cx="85" cy="115" rx="3" ry="4" fill="#ffd166" />
    <circle cx="85" cy="115" r="1.5" fill="#000000" />

    <!-- 4 SPLAYED ABERRANT TALONS (撕裂空間的四根畸變利爪) -->

    <!-- Talon 1: Top Clenched Claw -->
    <path d="M 105 88 C 115 75, 125 60, 148 48 C 144 58, 138 78, 122 88 Z"
          fill="url(#boneClawGrad)" stroke="#1a0003" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 125 80 L 148 48" stroke="#ffffff" stroke-width="0.8" />

    <!-- Talon 2: Main Thrust Razor Claw -->
    <path d="M 116 94 C 135 88, 160 82, 195 72 C 180 88, 155 102, 130 102 Z"
          fill="url(#boneClawGrad)" stroke="#1a0003" stroke-width="2" stroke-linejoin="round" />
    <path d="M 140 92 L 195 72" stroke="#ffffff" stroke-width="1" />

    <!-- Talon 3: Low Hook Claw -->
    <path d="M 112 108 C 130 110, 155 118, 185 116 C 168 128, 142 128, 120 118 Z"
          fill="url(#boneClawGrad)" stroke="#1a0003" stroke-width="2" stroke-linejoin="round" />
    <path d="M 135 116 L 185 116" stroke="#ffffff" stroke-width="0.8" />

    <!-- Talon 4: Opposing Thumb Talon (Curving inward) -->
    <path d="M 92 124 C 98 138, 110 152, 128 158 C 122 148, 114 136, 104 126 Z"
          fill="url(#boneClawGrad)" stroke="#1a0003" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Knuckle Joint Flesh Rips / Muscle Tears -->
    <path d="M 108 92 C 105 98, 112 104, 110 110" fill="none" stroke="#800f2f" stroke-width="2.5" />
    <path d="M 112 90 L 118 96" stroke="#ff4d6d" stroke-width="1.2" />
  </g>

  <!-- DRIPPING CORRUPTED ICHOR & DARK SPLATTERS (滴落深淵濁血) -->
  <g fill="#590d22" stroke="#100003" stroke-width="0.6">
    <!-- Drips from main talon -->
    <path d="M 194 73 C 196 78, 198 84, 197 88 C 195 91, 192 90, 193 86 Z" fill="#7209b7" />
    <circle cx="196" cy="94" r="1.8" fill="#240046" />
    <circle cx="195" cy="103" r="1.2" fill="#ff4d6d" />

    <!-- Drips from lower claw -->
    <path d="M 183 117 C 185 124, 184 130, 182 133 C 180 135, 178 133, 179 128 Z" fill="#800f2f" />
    <circle cx="182" cy="140" r="1.5" fill="#ff4d6d" />

    <!-- Floating Spatter Droplets -->
    <circle cx="160" cy="55" r="1.2" fill="#ff4d6d" />
    <circle cx="215" cy="90" r="1.6" fill="#ff334b" />
    <circle cx="145" cy="138" r="2" fill="#800f2f" />
    <circle cx="78" cy="72" r="1" fill="#7209b7" />
  </g>
</svg>
